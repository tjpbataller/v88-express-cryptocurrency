<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="/scripts/action.js" defer></script>
    <title>Cryptocurrency</title>
</head>
<body>
    <div class="container w-50 mx-auto">
        <div class="row">
            <h1 class="col-6 align-bottom" id="title" data-name="crypto">Cryptocurrency</h1>
            <a class="col-3 fs-5 align-bottom" href="#" data-name="finance">Finance Platforms</a>
            <a class="col-3 fs-5 align-bottom" href="#" data-name="exchange">Exchanges</a>
            <div class="col-12 my-5 text-center border border-dark border-5 p-3 overflow-auto" style="height: 500px;" id="list">
            </div>
            <button class="col-3 btn btn-secondary" data-action="prev">Prev 10</button>
            <button class="col-3 btn btn-primary mx-auto" data-action="top">List Top 100</button>
            <button class="col-3 btn btn-secondary " data-action="next">Next 10</button>
        </div>
    </div>
</body>
</html>
